<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>Custom Select</title></head>
<body>
<h1>自定义下拉</h1>
<form>
  <label for="cs-city">期望城市（原生）</label>
  <select id="cs-city" name="city"><option value="">请选择</option><option value="杭州">杭州</option><option value="上海">上海</option></select>
  <div id="cs-salary" role="listbox" tabindex="0" class="known-listbox"><div role="option" data-value="20k">20k</div><div role="option" data-value="30k">30k</div></div>
  <div id="cs-mystery" class="fancy-picker-widget"><div class="item">选项A</div></div>
</form>
</body></html>
