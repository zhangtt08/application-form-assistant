<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>Hidden Duplicates</title></head>
<body>
<h1>隐藏副本</h1>
<form>
  <label for="dh-name-visible">姓名</label>
  <input id="dh-name-visible" name="name" type="text">
  <input id="dh-name-hidden" name="name" type="text" style="display:none" aria-hidden="true">
  <label for="dh-school-visible">学校</label>
  <input id="dh-school-visible" name="school" type="text">
  <input id="dh-school-hidden" name="school" type="text" style="visibility:hidden">
</form>
</body></html>
