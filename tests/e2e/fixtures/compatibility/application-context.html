<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>Application Context Gate</title></head>
<body>

<header class="hdr-1a2b">
  <span>校园招聘</span><a href="#/jobs">职位列表</a><span class="nav-login-1a2b">登录</span>
  <div class="op-wrap-3c4d">
    <input id="kw-3c4d" type="text" placeholder="输入职位关键字" class="op-input-3c4d">
    <button type="button">搜索</button>
  </div>
</header>

<main class="page-5e6f">
  <h1 class="job-name-5e6f">载具策划 - 3C（望月）-2027届校招</h1>

  <div class="panel-body-7g8h" role="dialog" aria-label="登录">

    <h2>求职信息</h2>
    <div class="row-5o6p"><label for="app-position">期望职位</label><input id="app-position" type="text" placeholder="请输入期望职位"></div>
