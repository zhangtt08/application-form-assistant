<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>广州诗悦网络科技有限公司 - 校园招聘（Issue #004 语境门禁回归样本）</title>
</head>
<body>
<!--
  issue-004 回归样本：复刻 Moka 校招「未登录页」的三块语境。
  class 一律用哈希状命名（贴近 Moka 真实产物），故意**不给** login/auth/search 这类可读 class，
  逼判定只能依赖结构文本与 landmark —— 站点 class 不可依赖（§十二）。

  期望：
    hdr-search   → zone=search|navigation, eligible=false（分类器认它是 position-like 也没关系）
    login-phone  → zone=authentication,     eligible=false
    login-sms    → zone=authentication,     eligible=false
    login-agree  → 认证容器内的 checkbox，绝不成为申请候选
    app-phone    → zone=application,        eligible=true （§十四 反例：不能把手机号控件全封死）
    app-position → zone=application,        eligible=true （§十五 反例：含「职位」二字不等于搜索框）
-->

<header class="hdr-1a2b3c">
  <span class="brand-9z8y">校园招聘</span>
  <a href="#/home">首页</a>
  <a href="#/jobs">职位列表</a>
  <span class="nav-more-4d5e">登录</span>
  <div class="op-search-wrap-7f8a">
    <!-- id/name 刻意不含 search：让它穿过既有的「关键词忽略」层，逼语境门禁自己把它拦下 -->
    <input id="kw-7f8a" type="text" placeholder="输入职位关键字" class="op-search-input-7f8a">
    <button type="button" class="op-search-btn-7f8a">搜索</button>
  </div>
</header>

<main class="page-2c3d">
  <h1 class="job-name-5e6f">载具策划 - 3C（望月）-2027届校招</h1>
  <p class="job-meta-5e6f">本科 | 全职 | 在招职位</p>
  <button type="button" class="sd-Button-primary-8g9h">申请职位</button>

  <!-- 未登录点「申请职位」后原地弹出的登录面板（真实申请表单在它之后） -->
  <div class="sd-Panel-body-1x2Y" role="dialog" aria-label="登录">
    <div class="auth-tabs-3z4a">
      <span class="tab-on-3z4a">手机号登录</span>
      <span class="tab-off-3z4a">邮箱登录</span>
    </div>
    <div class="sd-Field-5b6c">
      <span class="sd-Addon-5b6c">+86</span>
      <input id="login-phone" type="text" placeholder="请输入手机号" autocomplete="tel" class="sd-Input-input-5b6c">
    </div>
    <div class="sd-Field-7d8e">
      <input id="login-sms" type="text" placeholder="请输入验证码" autocomplete="one-time-code" class="sd-Input-input-7d8e">
      <button type="button" class="sd-Link-7d8e">获取验证码</button>
    </div>
    <label class="sd-Agree-9f0g">
      <input id="login-agree" type="checkbox">
      首次登录会自动创建新账号，且已阅读并同意《隐私政策》
    </label>
    <button type="button" class="sd-Button-login-1h2i">登录</button>
  </div>

  <!-- 反例区：真实申请表单里的手机号 / 职位字段（姚记式结构，无 <form>） -->
  <section class="apply-block-4j5k">
    <h2 class="block-title-4j5k">个人信息</h2>
    <div class="row-6l7m"><label for="app-name">姓名</label><input id="app-name" type="text" placeholder="请输入姓名"></div>
    <div class="row-6l7m"><label for="app-phone">手机号码</label><input id="app-phone" type="tel" placeholder="请输入手机号"></div>
    <div class="row-6l7m"><label for="app-email">电子邮箱</label><input id="app-email" type="email" placeholder="请输入电子邮箱"></div>
    <div class="row-6l7m"><label for="app-school">毕业院校</label><input id="app-school" type="text" placeholder="请输入毕业院校"></div>
    <h2 class="block-title-8n9o">求职信息</h2>
    <div class="row-8n9o"><label for="app-position">期望职位</label><input id="app-position" type="text" placeholder="请输入期望职位"></div>
  </section>
</main>

<footer class="ft-2p3q">
  <span>更多资讯</span><span>诗悦官网</span><span>官方公众号</span>
  <input id="footer-subscribe" type="text" placeholder="订阅职位推荐">
</footer>
</body>
</html>
